
limit_req_zone $binary_remote_addr
    zone=cdn_limit:10m rate=50r/s;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location = /_auth {
        internal;

        proxy_pass http://auth:8000/verify;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-API-Key, Range, If-None-Match" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }

        limit_except GET HEAD {
            deny all;
        }

        limit_req zone=cdn_limit burst=100 nodelay;

        auth_request /_auth;

        try_files $uri =404;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-API-Key, Range, If-None-Match" always;

        add_header Access-Control-Expose-Headers
            "Content-Length, Content-Range, ETag, Last-Modified, Accept-Ranges"
            always;
    }
}
