
services:
  nginx:
    image: nginx:stable-alpine

    container_name: cdn-nginx

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    security_opt:
      - no-new-privileges:true
